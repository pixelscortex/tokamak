language: "rust"
layer: "application"
workspace:
  inheritedTasks:
    include: []
tasks:
  bundle:
    command: "proto run bun -- ../packages/build/src/build.ts"
    options:
      cache: false
  check:
    deps: ["bundle"]
    command: "proto run bun -- ../packages/build/src/check-app.ts tokamak-lab"
    options:
      cache: false
      mutex: "cargo"
  build:
    deps: ["bundle"]
    command: "cargo build --locked --package tokamak-lab --jobs 2"
    options:
      cache: false
      mutex: "cargo"
  run:
    deps: ["build"]
    command: "../target/debug/tokamak-lab"
    options:
      cache: false
      persistent: true
  test:
    deps: ["bundle"]
    command: "cargo test --locked --package tokamak-lab --jobs 2 -- --test-threads=1"
    options:
      cache: false
      mutex: "cargo"
