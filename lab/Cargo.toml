[package]
name = "tokamak-lab"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
runtime = { path = "../packages/runtime", features = ["client"] }
render = { path = "../packages/render" }

[build-dependencies]
tokamak-build = { path = "../packages/build" }

[dev-dependencies]
# The tests read what surfaces and plates drew (render's lab probes).
render = { path = "../packages/render", features = ["lab-probes"] }
serde_json = "1.0.154"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts"] }
blitz-traits = "=0.3.0-beta.4"
keyboard-types = "=0.8.0"
# Offscreen GPU frames and captures of the lab (tests/fused_surface.rs).
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["custom-widget"] }
anyrender = "=0.14.0"
anyrender_vello = "=0.15.0"
# PNG captures of the offscreen frames (already in the lock graph).
png = "=0.18.1"
