[package]
name = "tokamak-lab"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
runtime = { path = "../packages/runtime", features = ["client"] }
render = { path = "../packages/render" }

[build-dependencies]
tokamak-build = { path = "../packages/build" }

[dev-dependencies]
serde_json = "1.0.154"
blitz-dom = { git = "https://github.com/JustKira/blitz", rev = "673df1778499b3003d4ed00657313a439e97b77b", default-features = false, features = ["system-fonts"] }
blitz-traits = { git = "https://github.com/JustKira/blitz", rev = "673df1778499b3003d4ed00657313a439e97b77b" }
keyboard-types = "=0.8.0"
# Offscreen GPU frames and captures of the lab (tests/fused_surface.rs).
blitz-paint = { git = "https://github.com/JustKira/blitz", rev = "673df1778499b3003d4ed00657313a439e97b77b", default-features = false, features = ["custom-widget"] }
anyrender = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
# PNG captures of the offscreen frames (already in the lock graph).
png = "=0.18.1"
geo = { version = "=0.32.0", default-features = false }
peniko = "=0.6.1"
