# Rust host crates share package metadata and one size-oriented release profile.
[workspace]
members = ["packages/server", "packages/engine", "packages/runtime", "packages/render", "packages/build", "app", "lab"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.dev.package.rquickjs-sys]
# QuickJS's C interpreter built at -O0 spends so much native stack per JS call
# that a deeply nested Solid tree (the lab shell) exceeds QuickJS's 1 MiB stack
# budget in debug builds only ("Maximum call stack size exceeded" on mount).
# Optimising just this C crate in dev keeps debug behaviour equal to release.
opt-level = 2

[profile.release]
# On aarch64-apple-darwin with Rust 1.97.0, the empty host measured
# 286080 bytes with s versus 286096 with z. Remeasure as real code arrives.
opt-level = "s"
lto = true
strip = "symbols"
codegen-units = 1

# rquickjs-sys 0.14.0 with one upstream bug fix: quickjs-ng #1826 (commit
# e22ce4de), which stops Array.prototype.find/findIndex/findLast/findLastIndex
# from freeing an element twice when the deadline interrupt fires inside the
# loop. Without it a plugin that times out there crashes the whole process.
# The fork branch is the v0.14.0 tag plus that one line in the QuickJS source
# (https://github.com/JustKira/rquickjs, branch tokamak/v0.14.0-array-find-fix).
# Remove this patch once a released rquickjs-sys bundles a quickjs-ng with it.
[patch.crates-io]
rquickjs-sys = { git = "https://github.com/JustKira/rquickjs", rev = "f17e57e27b37a2c4d9ff12753f2b42067bf15394" }
