# Rust host crates share package metadata and one size-oriented release profile.
[workspace]
members = ["packages/server", "packages/engine", "packages/runtime", "packages/render", "packages/build", "app", "lab"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
# On aarch64-apple-darwin with Rust 1.97.0, the empty host measured
# 286080 bytes with s versus 286096 with z. Remeasure as real code arrives.
opt-level = "s"
lto = true
strip = "symbols"
codegen-units = 1

# Vendored QuickJS bindings with one upstream bug fix (Array.prototype.find*
# double-free when the deadline interrupt fires mid-loop). Remove this patch
# once a released rquickjs-sys bundles quickjs-ng with commit e22ce4de.
# Details and the exact diff: vendor/rquickjs-sys/TOKAMAK_PATCHES.md
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
