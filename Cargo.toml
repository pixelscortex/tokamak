# Rust host crates share package metadata and one size-oriented release profile.
[workspace]
members = ["packages/server", "packages/engine", "packages/runtime", "packages/render", "packages/build", "app", "lab"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.dev.package.rquickjs-sys]
# QuickJS's C interpreter built at -O0 spends so much native stack per JS call
# that a deeply nested Solid tree (the lab shell) exceeds QuickJS's 1 MiB stack
# budget in debug builds only ("Maximum call stack size exceeded" on mount).
# Optimising just this C crate in dev keeps debug behaviour equal to release.
opt-level = 2

[profile.release]
# On aarch64-apple-darwin with Rust 1.97.0, the empty host measured
# 286080 bytes with s versus 286096 with z. Remeasure as real code arrives.
opt-level = "s"
lto = true
strip = "symbols"
codegen-units = 1

# Vendored QuickJS bindings with one upstream bug fix (Array.prototype.find*
# double-free when the deadline interrupt fires mid-loop). Remove this patch
# once a released rquickjs-sys bundles quickjs-ng with commit e22ce4de.
# Details and the exact diff: vendor/rquickjs-sys/TOKAMAK_PATCHES.md
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }

# Blitz from our fork (github.com/pixelscortex/blitz), branch
# `blitz/widget-event-result`: the v0.3.0-beta.4 tag plus one commit, which
# lets a custom widget ignore an input event so the element's default action
# runs (self-painting plates, packages/render/SURFACES.md). Pinned by `rev`;
# rules and the list of changes: packages/render/BLITZ_FORK.md and
# BLITZ_CHANGES.md.
# Only blitz-dom is changed. blitz-traits and debug_timer are unchanged, but
# the fork's blitz-dom takes them from its own checkout while blitz-paint,
# blitz-html and blitz-shell (crates.io) ask crates.io for them: without
# these two entries the build has two copies of each and their types do not
# unify. stylo_taffy needs no entry (only blitz-dom depends on it, so it
# follows blitz-dom into the fork).
blitz-dom = { git = "https://github.com/pixelscortex/blitz", rev = "99c448f4d0100c604d0e807ddba429de60680cb0" }
blitz-traits = { git = "https://github.com/pixelscortex/blitz", rev = "99c448f4d0100c604d0e807ddba429de60680cb0" }
debug_timer = { git = "https://github.com/pixelscortex/blitz", rev = "99c448f4d0100c604d0e807ddba429de60680cb0" }
