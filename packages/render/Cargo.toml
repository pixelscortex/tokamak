# Render is a host crate, not a TypeScript feature implementation.
[package]
name = "render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Opt-in upstream successful-present timings; normal product builds stay quiet.
gpu-diagnostics = ["anyrender_vello/log_frame_times"]
# Compatibility for the lab's existing dev-dependency; exposes no probes.
lab-probes = []

[dependencies]
engine = { path = "../engine" }
# Blitz attaches surface/icon widgets and paints their ordinary vector scenes.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "custom-widget"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
blitz-shell = { version = "=0.3.0-beta.4", default-features = false, features = ["clipboard", "custom-widget"] }
# Read computed border radii and registered custom properties.
style = { package = "stylo", version = "=0.22.0" }
geo = { version = "=0.32.0", default-features = false }
anyrender = "=0.14.0"
anyrender_vello = "=0.15.0"
# Vector widgets share the scene colour and geometry types.
peniko = "=0.6.1"
winit = "=0.31.0-beta.3"
keyboard-types = "=0.8.0"
futures-lite = "=2.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
raw-window-handle = "=0.6.2"

# Physical memory size for the UI heap ceiling (already in the lock graph).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
