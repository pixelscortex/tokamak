# Render is a host crate, not a TypeScript feature implementation.
[package]
name = "render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Opt-in upstream successful-present timings; normal product builds stay quiet.
gpu-diagnostics = ["anyrender_vello/log_frame_times"]
# Lab-only `<tk-surface>` stress demo, `<tk-fps>` readout and benchmark hooks
# (surface/demo.rs, fps.rs, stats.rs). Product builds leave it off.
surface-demo = []

[dependencies]
engine = { path = "../engine" }
# `custom-widget` (dom, shell, paint) backs `<tk-surface>` (src/surface):
# dom attaches widgets, paint draws their scenes, shell creates and frees
# their GPU resources. blitz-dom's feature also enables its `accessibility`
# feature, which pulls in `accesskit`.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "custom-widget"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
blitz-shell = { version = "=0.3.0-beta.4", default-features = false, features = ["clipboard", "custom-widget"] }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["custom-widget"] }
# Stylo itself (blitz-dom's style engine, already in the lock graph): the
# materials binding reads computed border radii (surface/bind.rs).
style = { package = "stylo", version = "=0.22.0" }
anyrender = "=0.14.0"
anyrender_vello = "=0.15.0"
# Already in the lock graph through anyrender/vello; surfaces build image brushes.
peniko = "=0.6.1"
winit = "=0.31.0-beta.3"
keyboard-types = "=0.8.0"
futures-lite = "=2.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"

# macOS: present frames inside the window's Core Animation transaction
# during live resize (shell.rs `present_with_transaction`). Both are already
# in the lock graph through winit and wgpu.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
raw-window-handle = "=0.6.2"

# Physical memory size for the UI heap ceiling (already in the lock graph).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
