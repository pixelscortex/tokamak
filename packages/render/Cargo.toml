# Render is a host crate, not a TypeScript feature implementation.
[package]
name = "render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Opt-in upstream successful-present timings; normal product builds stay quiet.
gpu-diagnostics = ["anyrender_vello/log_frame_times"]

[dependencies]
runtime = { path = "../runtime" }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
blitz-shell = { version = "=0.3.0-beta.4", default-features = false, features = ["clipboard"] }
anyrender = "=0.14.0"
anyrender_vello = "=0.15.0"
winit = "=0.31.0-beta.3"
keyboard-types = "=0.8.0"
futures-lite = "=2.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
