# Render is a host crate, not a TypeScript feature implementation.
[package]
name = "render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Opt-in upstream successful-present timings; normal product builds stay quiet.
gpu-diagnostics = ["anyrender_vello/log_frame_times"]

[dependencies]
engine = { path = "../engine" }
# Blitz paints ordinary elements and SVG icon widgets.
blitz-dom = { git = "https://github.com/JustKira/blitz", rev = "378f3c6a459817f4ab083cb01968747c49ab576c", default-features = false, features = ["system-fonts", "custom-widget"] }
blitz-html = { git = "https://github.com/JustKira/blitz", rev = "378f3c6a459817f4ab083cb01968747c49ab576c", default-features = false }
blitz-traits = { git = "https://github.com/JustKira/blitz", rev = "378f3c6a459817f4ab083cb01968747c49ab576c" }
blitz-shell = { git = "https://github.com/JustKira/blitz", rev = "378f3c6a459817f4ab083cb01968747c49ab576c", default-features = false, features = ["custom-widget"] }
# Read computed styles and registered custom properties.
style = { package = "stylo", version = "=0.23.0", git = "https://github.com/servo/stylo", rev = "2dca34592ced37c6aa01733e94206a767194cf9d" }
anyrender = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
# Vector widgets share the scene colour and geometry types.
peniko = "=0.6.1"
winit = "=0.31.0-beta.4"
keyboard-types = "=0.8.0"
futures-lite = "=2.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
raw-window-handle = "=0.6.2"

# Physical memory size for the UI heap ceiling (already in the lock graph).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
