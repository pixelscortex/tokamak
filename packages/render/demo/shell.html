<!doctype html>
<!-- A static native shell only; the component tree comes entirely from Solid. -->
<html><head><style>
body { margin: 0; background: #f4f6fa; color: #18263b; font: 17px system-ui; }
.panel { padding: 28px; display: flex; flex-direction: column; gap: 10px; }
h1 { font-size: 27px; margin: 0 0 12px; }
p { margin: 2px 0; }
button, input { font: inherit; padding: 12px; border: 1px solid #91a2b9; border-radius: 8px; background: white; color: #18263b; }
button { cursor: pointer; }
button:hover { background: #e3ecff; }
button[data-pressed=true] { background: #d0efdf; }
button:disabled, input:disabled { opacity: .5; }
button:focus, input:focus { outline: 3px solid #2563eb; outline-offset: 2px; }
#help { font-size: 14px; color: #4a607e; }
</style></head><body><div id="app"></div></body></html>
