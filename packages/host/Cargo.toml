[package]
name = "tokamak-plugin-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
anyhow = "1"
rquickjs = { version = "=0.14.0", features = ["futures", "loader"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "rt", "sync", "time"] }
tokamak-worker = { path = "../worker" }
llrt_abort = { git = "https://github.com/awslabs/llrt", rev = "02833ca09748424a5960e37133530e24ccccae58" }
llrt_buffer = { git = "https://github.com/awslabs/llrt", rev = "02833ca09748424a5960e37133530e24ccccae58" }
llrt_crypto = { git = "https://github.com/awslabs/llrt", rev = "02833ca09748424a5960e37133530e24ccccae58" }
llrt_fetch = { git = "https://github.com/awslabs/llrt", rev = "02833ca09748424a5960e37133530e24ccccae58", default-features = false, features = [
  "http1",
  "tls-ring",
  "webpki-roots",
] }
llrt_fs = { git = "https://github.com/awslabs/llrt", rev = "02833ca09748424a5960e37133530e24ccccae58" }
llrt_os = { git = "https://github.com/awslabs/llrt", rev = "02833ca09748424a5960e37133530e24ccccae58" }
llrt_path = { git = "https://github.com/awslabs/llrt", rev = "02833ca09748424a5960e37133530e24ccccae58" }
llrt_stream_web = { git = "https://github.com/awslabs/llrt", rev = "02833ca09748424a5960e37133530e24ccccae58" }
llrt_url = { git = "https://github.com/awslabs/llrt", rev = "02833ca09748424a5960e37133530e24ccccae58" }

[lints]
workspace = true
