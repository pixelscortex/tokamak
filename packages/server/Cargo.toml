# Server is a host crate, not a TypeScript feature implementation.
[package]
name = "server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "tokamak-server"
path = "src/main.rs"

[[bin]]
name = "export-protocol"
path = "src/bin/export-protocol.rs"
required-features = ["protocol-codegen"]

[features]
default = ["local-runtime"]
local-runtime = ["tokamak-worker/local-runtime"]
protocol-codegen = ["dep:ts-rs"]

[dependencies]
dotenvy = "0.15.7"
tempfile = "3.27.0"
futures-util = "0.3.34"
directories = "=6.0.0"
sha2 = "0.10.9"
getrandom = "0.4.3"
subtle = "2.6.1"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
semver = "1.0.28"
# Match the Runner's JSON support for a shared reqwest build.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
axum = { version = "0.8.9", default-features = false, features = [
  "ws",
  "http1",
  "tokio",
  "query",
  "matched-path",
] }
http-body-util = "0.1.3"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["service", "tokio"] }
tower = { version = "0.5.3", default-features = false }
# Already used by the embedded engine; its owned cancellation future wakes
# accepted TCP I/O, including HTTP peers that never finish upgrade headers.
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
serde = { version = "1.0.228", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true, default-features = false, features = ["serde-json-impl"] }
# Direct storage/catalog/index APIs are pinned together: their contracts are internal.
anyhow = "1"
arc-swap = "1.9.3"
uuid = { version = "1", features = ["v4"] }
surrealdb-types = { version = "=4.0.0", default-features = false }
surrealdb-datastore = { version = "=4.0.0", default-features = false }
surrealdb-idx = { version = "=4.0.0", default-features = false, features = ["vector-index"] }
surrealdb-kvs = { version = "=4.0.0", default-features = false }
surrealdb-kvs-any = { version = "=4.0.0", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
engine = { path = "../engine" }
tokamak-worker = { path = "../worker", default-features = false }
# Decode the plugin host's JSON frames without changing their JavaScript numbers.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.54.1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "net",
  "signal",
  "time",
  "process",
  "io-util",
  "fs",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }

[lints]
workspace = true


[[test]]
name = "caller_actions"
required-features = ["local-runtime"]
