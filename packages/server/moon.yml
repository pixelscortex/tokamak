# Share Cargo tasks through moon's Rust toolchain inheritance.
language: "rust"
layer: "library"
tasks:
  fixture-test:
    command: "proto run bun -- test tests/build-feature.test.mjs"
  test:
    # Fixture isolation is part of normal validation, not an opt-in regression.
    deps: ["server:fixture-test"]
  protocol-check:
    # Compare formatted generator output: Oxfmt owns the committed TS layout.
    command: "bash ../../.ci/check-protocol.sh"
  check:
    deps: ["server:protocol-check"]
