[package]
name = "tokamak-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["local-runtime"]
local-runtime = ["dep:directories", "dep:getrandom", "dep:serde", "dep:windows-sys"]

[dependencies]
directories = { version = "=6.0.0", optional = true }
getrandom = { version = "0.4.3", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
# Match the Runner's codec and pipe support in the shared process crate.
tokio-util = { version = "0.7.20", features = ["codec", "io-util", "rt"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }


[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "time"] }
