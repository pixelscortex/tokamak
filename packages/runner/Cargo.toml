[package]
name = "tokamak-runner"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["ws"] }
engine = { path = "../engine" }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
server = { path = "../server" }
sha2 = "0.10.9"
tempfile = "3.27.0"
tokamak-worker = { path = "../worker" }
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
  "io-util",
] }
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
