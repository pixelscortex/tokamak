# Low-level JavaScript execution, independent of UI/server composition.
[package]
name = "engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rquickjs = { version = "=0.14.0", features = ["futures"] }
serde_json = "1.0.154"
sourcemap = { version = "9.3.2", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "macros"] }
# HTTP and timers are native capabilities; the JS adapter only shapes web values.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
url = "2.5.8"
encoding_rs = "0.8.35"
getrandom = "0.4.3"

[lints]
workspace = true
