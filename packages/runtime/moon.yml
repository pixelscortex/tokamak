language: "rust"
layer: "library"
tasks:
  ts-check:
    command: "proto run bun -- check --no-script --project tsconfig.json"
    options:
      cache: false
  check:
    deps: ["ts-check"]
    command: "cargo check --locked --all-features --all-targets"
    options:
      mergeArgs: "replace"
  test:
    command: "proto run bun -- --conditions=browser test tests/plugins.test.mjs tests/server-binary.test.ts"
    options:
      cache: false
      mergeArgs: "replace"
