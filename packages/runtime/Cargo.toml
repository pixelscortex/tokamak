# High-level host composition. Features keep client and server graphs separate.
[package]
name = "runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
client = ["dep:render", "dep:directories", "dep:tokio", "dep:serde_json", "dep:tokio-tungstenite", "dep:futures-util", "dep:reqwest", "dep:serde", "dep:libc"]
server = ["dep:server", "dep:engine"]

[dependencies]
engine = { path = "../engine", optional = true }
server = { path = "../server", optional = true }
render = { path = "../render", optional = true }
directories = { version = "=6.0.0", optional = true }
serde_json = { version = "1.0.154", optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "net", "time"], optional = true }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }

serde = { version = "1.0", features = ["derive"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
server = { path = "../server" }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }

[[test]]
name = "router"
path = "tests/router.rs"
required-features = ["client"]

[lints]
workspace = true
