# High-level host composition. Features keep client and server graphs separate.
[package]
name = "runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
client = ["dep:render", "dep:directories", "dep:tokio", "dep:serde_json", "dep:tokio-tungstenite", "dep:futures-util"]
server = ["dep:server", "dep:engine"]

[dependencies]
engine = { path = "../engine", optional = true }
server = { path = "../server", optional = true }
render = { path = "../render", optional = true }
directories = { version = "=6.0.0", optional = true }
serde_json = { version = "1.0.154", optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "net", "time"], optional = true }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"], optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }

[dev-dependencies]
server = { path = "../server" }
blitz-dom = { git = "https://github.com/JustKira/blitz", rev = "378f3c6a459817f4ab083cb01968747c49ab576c", default-features = false }

[[test]]
name = "router"
path = "tests/router.rs"
required-features = ["client"]
