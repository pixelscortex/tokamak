# Only render and its reachable runtime dependencies: never build the database.
language: "rust"
layer: "library"
tasks:
  bundle:
    command: "proto run bun -- tools/bundle.mjs"
    env:
      NODE_ENV: "production"
    outputs: ["dist/demo.js", "dist/demo.js.map"]
    options:
      cache: false
  styles:
    command: "proto run bun -- tools/bundle-shell.ts"
    outputs: ["dist/shell.html"]
    options:
      cache: false
  check:
    deps: ["bundle", "styles"]
    command: "sh tools/check.sh"
    options:
      mergeArgs: "replace"
  test:
    # Native UI fixtures load the compiled element CSS even when ui:test is not run.
    deps: ["bundle", "styles", "ui:build"]
    command: "sh tests/run.sh"
    options:
      mergeArgs: "replace"
  build:
    deps: ["check"]
    command: "cargo build --locked --release --package render --bin demo --jobs 2"
    env:
      RAYON_NUM_THREADS: "2"
      CARGO_BUILD_JOBS: "2"
    options:
      mergeArgs: "replace"
  demo:
    deps: ["build"]
    command: "../target/release/demo"
    options:
      cache: false
      persistent: true
