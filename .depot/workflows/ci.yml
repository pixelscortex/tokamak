name: Linux CI
on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:
concurrency:
  # A branch push and its PR update share one group instead of duplicating work.
  group: linux-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
        with:
          native: "false"
      - run: moon run workspace:ci-ts --summary detailed
  rust-lint:
    # Compile-only validation runs beside TS, sharing native's Depot/sccache caches.
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - name: Native compile dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: ./.ci/setup
      - run: moon run workspace:ci-rust --summary detailed
      - if: always()
        run: sccache --show-stats
  native:
    needs: [typescript, rust-lint]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - name: Headless native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: ./.ci/setup
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: proto run bun -- x playwright install --with-deps --no-shell chromium webkit
      - run: moon run workspace:ci-native --summary detailed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-failure
          include-hidden-files: true
          path: |
            .ci-results/playwright/
            .ci-results/playwright-report/
          if-no-files-found: ignore
      - if: always()
        run: sccache --show-stats
      - name: Report ACP tests to Depot
        if: ${{ !cancelled() && hashFiles('.ci-results/acp.xml') != '' }}
        uses: depot/test-report-action@2ad5779840a9c63e884fa26f11d019768a27a941 # v1
        with:
          path: .ci-results/acp.xml
  release:
    # Manual only for now: `depot ci dispatch` on main builds server release artifacts.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: depot-ubuntu-24.04
            arch: x64
          - runner: depot-ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: ./.ci/setup
      - run: |
          moon run workspace:build-release
          mkdir -p .ci-results
          tar -czf .ci-results/server-linux-${{ matrix.arch }}.tar.gz -C target/release tokamak
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-linux-${{ matrix.arch }}
          path: .ci-results/server-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error
          retention-days: 7
