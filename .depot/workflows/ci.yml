name: Linux CI
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", ".tmp/**", "wiki/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".tmp/**", "wiki/**"]
  merge_group:
  workflow_dispatch:
concurrency:
  group: linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
      - run: moon run workspace:ci-ts --summary detailed
  native:
    needs: typescript
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
      WGPU_BACKEND: vulkan
      TK_CAPTURE_DIR: /tmp/tokamak-captures
      XDG_RUNTIME_DIR: /tmp/tokamak-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - name: Headless native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers fonts-dejavu-core
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # lavapipe's ICD filename includes the architecture on Ubuntu.
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)" >> "$GITHUB_ENV"
      - uses: ./.ci/setup
      - run: moon run workspace:ci-native --summary detailed
      - if: always()
        run: sccache --show-stats
      - name: Release server (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: moon run workspace:build-release
      # Signing, release publication and deployment will follow artifact validation.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: server-linux-x64
          path: target/release/tokamak
          if-no-files-found: error
          retention-days: 7
  release-arm64:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: native
    runs-on: depot-ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: ./.ci/setup
      - run: moon run workspace:build-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-linux-arm64
          path: target/release/tokamak
          if-no-files-found: error
          retention-days: 7
