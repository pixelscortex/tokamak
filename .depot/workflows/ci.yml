name: Linux CI
on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:
concurrency:
  # A branch push and its PR update share one group instead of duplicating work.
  group: linux-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
        with:
          native: "false"
      - run: moon run workspace:ci-ts --summary detailed
  rust-lint:
    # Compile-only validation runs beside TS, sharing native's Depot/sccache caches.
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - name: Native compile dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - uses: ./.ci/setup
      - run: moon run workspace:ci-rust --summary detailed
      - if: always()
        run: sccache --show-stats
  native:
    # Warm native validation still took almost 14 minutes; keep it off PRs.
    # A manual release dispatch re-runs it so nothing ships unchecked.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [typescript, rust-lint]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
      WGPU_BACKEND: vulkan
      TK_CAPTURE_DIR: /tmp/tokamak-captures
      XDG_RUNTIME_DIR: /tmp/tokamak-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - name: Headless native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers fonts-dejavu-core
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # lavapipe's ICD filename includes the architecture on Ubuntu.
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)" >> "$GITHUB_ENV"
      - uses: ./.ci/setup
      - run: moon run workspace:ci-native --summary detailed
      - if: always()
        run: sccache --show-stats
      - name: Report ACP tests to Depot
        if: ${{ !cancelled() && hashFiles('.ci-results/acp.xml') != '' }}
        uses: depot/test-report-action@2ad5779840a9c63e884fa26f11d019768a27a941 # v1
        with:
          path: .ci-results/acp.xml
  release:
    # Manual only for now: `depot ci dispatch` on main builds and stages a release.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: depot-ubuntu-24.04
            arch: x64
          - runner: depot-ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write # Depot's built-in GitHub App token can stage release assets.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: ./.ci/setup
      - run: |
          moon run workspace:build-release
          mkdir -p .ci-results
          tar -czf .ci-results/server-linux-${{ matrix.arch }}.tar.gz -C target/release tokamak
      - name: Stage this commit's release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun .ci/release.mjs stage .ci-results/server-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-linux-${{ matrix.arch }}
          path: .ci-results/server-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error
          retention-days: 7
