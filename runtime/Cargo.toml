# Runtime is a host crate, not a TypeScript feature implementation.
[package]
name = "runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Only promise support: no filesystem/module loader, macros, or cross-thread JS.
# Pin the bundled engine: source-map column normalization is version-sensitive.
rquickjs = { version = "=0.14.0", features = ["futures"] }
serde_json = "1.0.154"
sourcemap = { version = "9.3.2", default-features = false }
# Workers need an executor and timers, not a network stack or multithread scheduler.
tokio = { version = "1.54.1", features = ["rt", "time", "sync"] }
