# Reusable packages and the single desktop composition have explicit roots.
$schema: "https://moonrepo.dev/schemas/workspace.json"
versionConstraint: "2.5.6"
projects:
  workspace: "."
  server: "packages/server"
  runtime: "packages/runtime"
  engine: "packages/engine"
  sdk: "packages/sdk"
  ui: "packages/ui"
  build: "packages/build"
  app: "app"
  wiki: "wiki"
  chat: "plugins/chat"
  ai: "plugins/ai"
vcs:
  defaultBranch: "main"
  provider: "github"
# Depot's documentation calls this unstable_remote; moon 2.5.6 calls it remote.
remote:
  host: "grpcs://cache.depot.dev"
  auth:
    token: "DEPOT_TOKEN"
