# Explicit roots keep the singular feature app/ separate from native apps/.
$schema: 'https://moonrepo.dev/schemas/workspace.json'
versionConstraint: '2.5.6'
projects:
  workspace: '.'
  server: 'server'
  runtime: 'runtime'
  render: 'render'
  sdk: 'sdk'
  ui: 'ui'
  desktop: 'apps/desktop'
  todos: 'app/todos'
vcs:
  defaultBranch: 'main'
  provider: 'github'

