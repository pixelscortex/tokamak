name: macOS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    runs-on: depot-macos-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: ./.ci/setup
      - run: bash .ci/check.sh rust
      - run: proto run bun -- run --cwd app tauri build --no-sign
      - if: always()
        run: sccache --show-stats
