name: macOS CI
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".tmp/**", "wiki/**"]
  # A small Linux selector permits a label to override native path detection.
  # Event-level path filters cannot express "native paths OR ci:macos label".
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - name: Select native changes or explicit label
        id: paths
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            if (context.eventName !== 'pull_request' || context.payload.pull_request.labels.some(l => l.name === 'ci:macos')) {
              core.setOutput('native', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100,
            });
            const native = /^(packages\/(render|engine|runtime|server|build)\/|app\/|lab\/|Cargo\.|rust-toolchain|\.moon\/|\.prototools$|moon\.yml$|\.ci\/|\.github\/workflows\/macos\.yml$|bun\.lock$|package\.json$)/;
            core.setOutput('native', files.some(f => native.test(f.filename) || native.test(f.previous_filename || '')));
  macos:
    needs: select
    if: needs.select.outputs.native == 'true'
    runs-on: depot-macos-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
      WGPU_BACKEND: metal
      TK_CAPTURE_DIR: /tmp/tokamak-captures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
      - run: |
          moon run workspace:ci-ts --summary detailed
          moon run workspace:ci-native --summary detailed
      - if: always()
        run: sccache --show-stats
      - name: Release desktop and server (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: moon run app:build
      # Signing, release publication and deployment will follow artifact validation.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: desktop-server-macos-arm64
          path: |
            target/release/tokamak
            target/release/tokamak-desktop
          if-no-files-found: error
          retention-days: 7
