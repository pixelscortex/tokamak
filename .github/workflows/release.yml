name: Unsigned macOS release
on:
  workflow_dispatch:
    inputs:
      macos_signing_identity:
        description: Reserved for future signing; leave empty
        type: string
        default: ""
      macos_notarization_profile:
        description: Reserved for future notarization; leave empty
        type: string
        default: ""
permissions:
  contents: read
jobs:
  release:
    runs-on: depot-macos-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "4"
      RAYON_NUM_THREADS: "4"
      MACOS_SIGNING_IDENTITY: ${{ inputs.macos_signing_identity }}
      MACOS_NOTARIZATION_PROFILE: ${{ inputs.macos_notarization_profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: ./.ci/setup
      - run: bash .ci/release-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-macos-arm64
          path: .ci-results/macos-arm64/
          if-no-files-found: error
          retention-days: 7
