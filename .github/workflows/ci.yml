name: CI
on:
  pull_request:
    # ready_for_review starts the checks when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Draft pull requests are not checked: work in progress is tested locally, and
  # the checks run once a pull request is marked ready for review.
  typescript:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
        with:
          native: "false"
      - run: moon run workspace:ci-ts --summary detailed
  lint:
    # Formatting and lint for TypeScript and Rust. Platform independent, so it runs once.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - name: Native compile dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: ./.ci/setup
      - run: moon run workspace:ci-lint --summary detailed
      - if: always()
        run: sccache --show-stats
  rust:
    # Build the Runner and cloud server and run their offline suites.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
      - run: moon run workspace:ci-rust --summary detailed
      - if: always()
        run: sccache --show-stats
  desktop-mac:
    # The unsigned macOS Tauri bundle. It is built only when started by hand
    # (Run workflow): macOS runner minutes are billed at 20x Linux minutes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: depot-macos-latest
    timeout-minutes: 60
    env:
      # The macOS runner has 8 CPUs; two jobs left it mostly idle.
      CARGO_BUILD_JOBS: "4"
      RAYON_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
      - name: Build unsigned macOS bundle
        run: proto run bun -- run --cwd app tauri build --no-sign
      - name: Archive macOS bundle
        run: |
          mkdir -p .ci-results
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Tokamak.app .ci-results/Tokamak-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-mac-${{ runner.arch }}
          path: .ci-results/Tokamak-macos.zip
          if-no-files-found: error
          retention-days: 7
      - if: always()
        run: sccache --show-stats
  desktop-windows:
    # The unsigned Windows installer. Like the Mac app, it is built only when
    # started by hand (Run workflow), to keep pushes to main cheap.
    if: github.event_name == 'workflow_dispatch'
    # Remove continue-on-error after Windows builds and installed-app smoke checks are reliable.
    continue-on-error: true
    # https://depot.dev/docs/github-actions/runner-types#windows-runners
    runs-on: depot-windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
      - name: Configure Windows build parallelism
        shell: pwsh
        run: |
          $cpus = [Environment]::ProcessorCount
          Write-Output "Windows runner logical CPUs: $cpus"
          "CARGO_BUILD_JOBS=$cpus" >> $env:GITHUB_ENV
          "RAYON_NUM_THREADS=$cpus" >> $env:GITHUB_ENV
      # Reuse linking and build scripts too; sccache cannot cache Rust binaries.
      - name: Restore Windows release build
        id: windows-release
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            target/release
            !target/release/bundle
            !target/release/incremental
          key: windows-release-v1-${{ runner.arch }}-x86_64-pc-windows-msvc-${{ hashFiles('.prototools', 'rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/config*') }}-${{ github.sha }}
          restore-keys: windows-release-v1-${{ runner.arch }}-x86_64-pc-windows-msvc-${{ hashFiles('.prototools', 'rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/config*') }}-
      - name: Restore unchanged Windows input timestamps
        run: |
          proto run bun -- test ./.ci/windows-cache-inputs.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          proto run bun -- .ci/windows-cache-inputs.mjs
      # Build only: Windows test suites are intentionally outside this job's scope.
      - name: Build unsigned Windows installer
        run: proto run bun -- run --cwd app tauri build --no-sign --bundles nsis
      - name: Save Windows release build
        if: steps.windows-release.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            target/release
            !target/release/bundle
            !target/release/incremental
          key: ${{ steps.windows-release.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
  release:
    # Manual only for now: running this workflow by hand on main builds server release artifacts.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [typescript, lint, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: depot-ubuntu-24.04
            arch: x64
          - runner: depot-ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: ./.ci/setup
      - run: |
          bash .ci/check.sh cloud-graph
          moon run workspace:build-release
          mkdir -p .ci-results
          tar -czf .ci-results/server-linux-${{ matrix.arch }}.tar.gz -C target/cloud/release tokamak-server tokamak-plugin-host
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-linux-${{ matrix.arch }}
          path: .ci-results/server-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error
          retention-days: 7
