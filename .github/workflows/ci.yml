name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
        with:
          native: "false"
      - run: moon run workspace:ci-ts --summary detailed
  rust-lint:
    # Compile-only validation runs beside TS, sharing native's Depot/sccache caches.
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - name: Native compile dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: ./.ci/setup
      - run: moon run workspace:ci-rust --summary detailed
      - if: always()
        run: sccache --show-stats
  native:
    needs: [typescript, rust-lint]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - name: Headless native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: ./.ci/setup
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: proto run bun -- x playwright install --with-deps --no-shell chromium webkit
      - run: moon run workspace:ci-native --summary detailed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-failure
          include-hidden-files: true
          path: |
            .ci-results/playwright/
            .ci-results/playwright-report/
          if-no-files-found: ignore
      - if: always()
        run: sccache --show-stats
  desktop:
    # The unsigned macOS Tauri bundle, built beside the Linux jobs.
    runs-on: depot-macos-latest
    timeout-minutes: 60
    env:
      # The macOS runner has 8 CPUs; two jobs left it mostly idle.
      CARGO_BUILD_JOBS: "4"
      RAYON_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
      - run: bash .ci/check.sh rust
      - run: proto run bun -- run --cwd app tauri build --no-sign
      - if: always()
        run: sccache --show-stats
  desktop-windows:
    # The installer takes about 20 minutes to build, so it is built for main
    # (and by hand) only, not for every pull request.
    if: github.event_name != 'pull_request'
    # Remove continue-on-error after Windows builds and installed-app smoke checks are reliable.
    continue-on-error: true
    # https://depot.dev/docs/github-actions/runner-types#windows-runners
    runs-on: depot-windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.ci/setup
      # Build only: Windows test suites are intentionally outside this job's scope.
      - name: Build unsigned Windows installer
        run: proto run bun -- run --cwd app tauri build --no-sign --bundles nsis
      - name: Smoke check server build identity
        shell: pwsh
        run: |
          $id = & ./target/release/tokamak.exe --build-id
          if ($LASTEXITCODE -ne 0 -or $id -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Server did not print a 64-character build identity'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
  release:
    # Manual only for now: running this workflow by hand on main builds server release artifacts.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: depot-ubuntu-24.04
            arch: x64
          - runner: depot-ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: ./.ci/setup
      - run: |
          moon run workspace:build-release
          mkdir -p .ci-results
          tar -czf .ci-results/server-linux-${{ matrix.arch }}.tar.gz -C target/release tokamak
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-linux-${{ matrix.arch }}
          path: .ci-results/server-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error
          retention-days: 7
