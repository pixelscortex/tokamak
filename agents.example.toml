# Install once; Tokamak discovers installed adapters automatically:
# npm install -g @agentclientprotocol/claude-agent-acp@0.106.0 @agentclientprotocol/codex-acp@2.6.0
# Gemini CLI is also discovered automatically and runs with --acp.
# No agents.toml is required. Copy this file to the Tokamak data directory only
# for overrides, or set TOKAMAK_ACP_AGENTS to its path. Restart after config edits.
# Entries override built-ins by id; omitted fields keep their built-in defaults.
# Only listed environment variables reach adapters. HOME reuses CLI logins.

# Example: use a particular adapter installation and optionally pass an API key.
# [agents.claude]
# command = "/absolute/path/to/claude-agent-acp"
# env = ["PATH", "HOME", "USER", "LANG", "ANTHROPIC_API_KEY"]

# Example: disable a built-in.
# [agents.codex]
# enabled = false

# Example: add a custom agent (no default env or plugins for custom entries).
# [agents.custom]
# command = "/absolute/path/to/custom-acp"
# args = []
# env = ["PATH", "HOME", "USER", "LANG"]
# plugins = ["acp"]
