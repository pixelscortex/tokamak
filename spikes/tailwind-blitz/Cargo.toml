# Independent investigation: never joins or changes the host workspace.
[workspace]

[package]
name = "tailwind-blitz-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
anyrender = "=0.14.0"
anyrender_vello_cpu = "=0.18.0"
peniko = "=0.6.1"
png = "=0.18.1"
keyboard-types = "=0.8.0"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"
codegen-units = 1
