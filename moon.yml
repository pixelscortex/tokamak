# Workspace-only operations; language tasks belong to the individual projects.
language: "unknown"
layer: "configuration"
workspace:
  inheritedTasks:
    include: []
tasks:
  # Cache complete verification stages, not Cargo target directories. Inputs
  # cover cross-package imports and native include_str! dependencies; explicit
  # exclusions keep generated files out of the native input glob walker.
  ci-ts:
    command: "bash .ci/check.sh ts"
    inputs: &ci-inputs
      - "/**/*"
      - "!/**/node_modules/**"
      - "!/**/dist/**"
      - "!/**/_generated/**"
      - "!/target/**"
      - "!/.git/**"
      - "!/.moon/cache/**"
      - "!/.proto/**"
      - "!/.ci-results/**"
      - "!/app/.dev/**"
      - "$RUSTFLAGS"
      - "$CARGO_ENCODED_RUSTFLAGS"
      - "$RUNNER_OS"
      - "$RUNNER_ARCH"
    options:
      cache: true
      outputStyle: stream
  ci-lint:
    command: "bash .ci/check.sh lint"
    inputs: *ci-inputs
    options:
      cache: true
      outputStyle: stream
  ci-rust:
    command: "bash .ci/check.sh rust"
    inputs: *ci-inputs
    options:
      cache: true
      outputStyle: stream
  acp-test:
    script: "mkdir -p .ci-results && proto run bun -- test plugins/acp --reporter=junit --reporter-outfile=.ci-results/acp.xml"
    options:
      cache: false
  plugins-check:
    script: >-
      proto run bun -- packages/sdk/tools/bundle.mjs plugins/chat/src/server --plugin chat &&
      proto run bun -- check --no-script --project plugins/chat/tsconfig.json &&
      proto run bun -- check --no-script --project plugins/chat/src/client/tsconfig.json &&
      proto run bun -- packages/build/src/build.ts plugins/acp &&
      proto run bun -- check --no-script --project plugins/acp/src/server/tsconfig.json
    options:
      cache: false
  e2e-check:
    command: "proto run bun -- check --no-script --project e2e/tsconfig.json"
    options:
      cache: false
  wiki-check:
    command: "proto run bun -- check --no-script --project wiki/tsconfig.json"
    options:
      cache: false
  rust-test:
    deps: ["app:web-build"]
    command: "cargo test --locked --workspace --jobs 2"
    options:
      cache: false
      mutex: "cargo"
  e2e:
    command: "proto run bun -- e2e/run.ts"
    options:
      cache: false
      mutex: "cargo"
  build-release:
    command: "cargo build --locked --release --package server --bin tokamak-server --target-dir target"
    # The server depends on engine, not the UI/app/plugin bundles. Keep an
    # unrelated frontend change from forcing another release link.
    inputs:
      - "/packages/server/**/*"
      - "/packages/engine/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/rust-toolchain.toml"
      - "/.prototools"
      - "/.cargo/**/*"
      - "/.moon/**/*"
      - "/moon.yml"
      - "!/**/node_modules/**"
      - "!/**/dist/**"
      - "!/.moon/cache/**"
      - "$RUSTFLAGS"
      - "$CARGO_ENCODED_RUSTFLAGS"
    outputs: ["target/release/tokamak-server"]
    options:
      cache: true
      mutex: "cargo"
  size:
    deps: ["workspace:build-release"]
    # stat fails on a missing artifact, unlike reporting an absent baseline as zero.
    command:
      - "proto"
      - "run"
      - "bun"
      - "--"
      - "-e"
      - >-
        import { stat } from "node:fs/promises";
        for (const binary of ["tokamak-server"]) {
          const path = "target/release/" + binary + (process.platform === "win32" ? ".exe" : "");
          const { size } = await stat(path);
          console.log(path + ": " + size + " bytes");
        }
    options:
      cache: false
  format:
    script: "proto run bun -- run oxfmt --write . && cargo fmt --all"
    options:
      cache: false
  format-check:
    script: "proto run bun -- run oxfmt --check . && cargo fmt --all --check"
    options:
      cache: false
  lint-rust:
    command: "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"
    options:
      cache: false
      mutex: "cargo"
  lint-ts:
    command: "proto run bun -- run oxlint packages app plugins"
    options:
      cache: false
  duplicates:
    command: 'bun run jscpd packages app plugins --format rust,typescript,tsx,javascript --ignore "**/tests/**,**/vendor/**,**/dist/**,**/target/**,**/node_modules/**,**/protocol.ts" --min-lines 6 --min-tokens 50'
    options:
      cache: false
      allowFailure: true
