# Workspace-only operations; language tasks belong to the individual projects.
language: "unknown"
layer: "configuration"
workspace:
  inheritedTasks:
    include: []
tasks:
  # Cache complete verification stages, not Cargo target directories. Inputs
  # cover cross-package imports and native include_str! dependencies; explicit
  # exclusions keep generated files out of the native input glob walker.
  ci-ts:
    command: "bash .ci/check.sh ts"
    inputs: &ci-inputs
      - "/**/*"
      - "!/**/node_modules/**"
      - "!/**/dist/**"
      - "!/**/_generated/**"
      - "!/target/**"
      - "!/.git/**"
      - "!/.moon/cache/**"
      - "!/.proto/**"
      - "!/.ci-results/**"
      - "$RUSTFLAGS"
      - "$CARGO_ENCODED_RUSTFLAGS"
    outputs: [".ci-results/acp.xml"]
    options:
      cache: true
      outputStyle: stream
  ci-native:
    command: "bash .ci/check.sh native"
    inputs: *ci-inputs
    options:
      cache: true
      outputStyle: stream
  acp-test:
    script: "mkdir -p .ci-results && proto run bun -- test plugins/acp --reporter=junit --reporter-outfile=.ci-results/acp.xml"
    options:
      cache: false
  rust-test:
    # :test already runs per-crate integration/doc suites. Add feature-unified
    # unit/bin tests and the app's e2e suite omitted by its selected test script,
    # without repeating all server integration tests and their deadline waits.
    deps: ["app:bundle", "app:test-fixtures", "lab:bundle", "render:bundle", "render:styles"]
    script: >-
      cargo test --locked --workspace --all-features --lib --bins --jobs 2 -- --test-threads=1 &&
      cargo test --locked --package tokamak-app --test e2e --jobs 2 -- --test-threads=1
    options:
      cache: false
      mutex: "cargo"
  gpu-test:
    # Explicitly select only offline captures, never all ignored tests.
    deps: ["lab:bundle"]
    command: "cargo test --locked --package tokamak-lab --test shell --jobs 2 -- --ignored capture_ --test-threads=1"
    options:
      cache: false
      mutex: "cargo"
  e2e:
    deps: ["app:test"]
    command: "proto run bun -- e2e/run.ts"
    options:
      cache: false
      mutex: "cargo"
  build-release:
    command: "cargo build --locked --release --package server --bin tokamak --target-dir target"
    # The server depends on engine, not the UI/app/plugin bundles. Keep an
    # unrelated frontend change from forcing another release link.
    inputs:
      - "/packages/server/**/*"
      - "/packages/engine/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/rust-toolchain.toml"
      - "/.prototools"
      - "/.cargo/**/*"
      - "/.moon/**/*"
      - "/moon.yml"
      - "!/**/node_modules/**"
      - "!/**/dist/**"
      - "!/.moon/cache/**"
      - "$RUSTFLAGS"
      - "$CARGO_ENCODED_RUSTFLAGS"
    outputs: ["target/release/tokamak"]
    options:
      cache: true
      mutex: "cargo"
  size:
    deps: ["app:build"]
    # stat fails on a missing artifact, unlike reporting an absent baseline as zero.
    command:
      - "proto"
      - "run"
      - "bun"
      - "--"
      - "-e"
      - >-
        import { stat } from "node:fs/promises";
        for (const binary of ["tokamak", "tokamak-desktop"]) {
          const path = "target/release/" + binary + (process.platform === "win32" ? ".exe" : "");
          const { size } = await stat(path);
          console.log(path + ": " + size + " bytes");
        }
    options:
      cache: false
  format:
    script: "proto run bun -- run oxfmt --write . && cargo fmt --all"
    options:
      cache: false
  format-check:
    script: "proto run bun -- run oxfmt --check . && cargo fmt --all --check"
    options:
      cache: false
  lint-rust:
    deps: ["app:bundle", "lab:bundle", "render:bundle", "render:styles"]
    command: "cargo clippy --locked --workspace --lib --bins --all-features"
    options:
      cache: false
      mutex: "cargo"
      allowFailure: true
  lint-ts:
    command: "proto run bun -- run oxlint packages app lab plugins"
    options:
      cache: false
  duplicates:
    command: 'bun run jscpd packages app lab plugins --format rust,typescript,tsx,javascript --ignore "**/tests/**,**/vendor/**,**/dist/**,**/target/**,**/node_modules/**,**/protocol.ts" --min-lines 6 --min-tokens 50'
    options:
      cache: false
      allowFailure: true
