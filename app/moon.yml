# Vite's internal integration prepares the sole application for Cargo and checks.
language: 'rust'
layer: 'application'
workspace:
  inheritedTasks:
    include: []
tasks:
  bundle:
    command: 'proto run bun -- x --no-install vite build'
    options:
      cache: false
  check:
    deps: ['bundle', 'fixture-bundle']
    command: 'proto run bun -- ../packages/build/src/check-app.ts'
    options:
      cache: false
      mutex: 'cargo'
  fixture-bundle:
    command: 'proto run bun -- tests/build-todo.ts'
    options:
      cache: false
  build:
    deps: ['bundle']
    command: 'cargo build --locked --release --package tokamak-app --package server --bins --jobs 2'
    options:
      cache: false
      mutex: 'cargo'
  run:
    deps: ['build']
    command: 'proto run bun -- ../packages/runtime/tools/run-app.ts app'
    options:
      cache: false
      persistent: true
  server-start:
    deps: ['build']
    command: 'proto run bun -- ../packages/runtime/tools/run-app.ts start'
    options:
      cache: false
  test:
    deps: ['bundle']
    command: 'sh tests/run.sh'
    options:
      cache: false
      mutex: 'cargo'
