language: "typescript"
layer: "application"
workspace:
  inheritedTasks:
    include: []
tasks:
  check:
    command: "proto run bun -- run check"
  test:
    command: "proto run bun -- run test"
    options:
      cache: false
  web-build:
    command: "proto run bun -- run build"
    outputs: ["dist"]
  build:
    deps: ["app:web-build"]
    command: "proto run bun -- run tauri build --no-sign"
    options:
      cache: false
      mutex: "cargo"
  server-build:
    script: >-
      proto run bun -- ../packages/build/src/build.ts ../plugins/chat &&
      cargo build --locked -p server --bin tokamak
    options:
      cache: false
      mutex: "cargo"
  server:
    deps: ["app:server-build"]
    command: "proto run bun -- scripts/server.ts"
    options:
      cache: false
      persistent: true
      runInCI: false
  run:
    command: "proto run bun -- run tauri dev"
    options:
      cache: false
      persistent: true
      runInCI: false
  dev:
    command: "proto run bun -- run dev"
    options:
      cache: false
      persistent: true
      runInCI: false
