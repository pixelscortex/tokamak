# Vite's internal integration prepares the sole application for Cargo and checks.
language: 'rust'
layer: 'application'
workspace:
  inheritedTasks:
    include: []
tasks:
  bundle:
    command: 'proto run bun -- x --no-install vite build'
    options:
      cache: false
  check:
    deps: ['bundle']
    command: 'proto run bun -- ../packages/build/src/check-app.ts'
    options:
      cache: false
      mutex: 'cargo'
  build:
    deps: ['bundle']
    command: 'cargo build --locked --release --package tokamak-app --bin tokamak-desktop --jobs 2'
    options:
      cache: false
      mutex: 'cargo'
  run:
    deps: ['build']
    command: '../target/release/tokamak-desktop'
    options:
      cache: false
      persistent: true
  test:
    deps: ['bundle']
    command: 'sh tests/run.sh'
    options:
      cache: false
      mutex: 'cargo'
