[package]
name = "tokamak-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1.0.154"

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
tokamak-worker = { path = "../../packages/worker" }
tokio = { version = "1.54.1", features = ["io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true
