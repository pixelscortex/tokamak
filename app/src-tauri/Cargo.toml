[package]
name = "tokamak-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1.0.154"

[dependencies]
tauri = { version = "2", features = [] }
directories = "=6.0.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokamak-worker = { path = "../../packages/worker" }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "sync", "time"] }

[lints]
workspace = true
