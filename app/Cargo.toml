# The one desktop executable composes reusable hosts, never feature logic.
[package]
name = "tokamak-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "tokamak-desktop"
path = "src/main.rs"

[dependencies]
server = { path = "../packages/server" }
render = { path = "../packages/render" }
runtime = { path = "../packages/runtime" }
directories = "=6.0.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "macros"] }
tower = { version = "0.5.3", default-features = false }

# Native document tests drive the same Blitz controls as the desktop shell.
[dev-dependencies]
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts"] }
blitz-traits = "=0.3.0-beta.4"
keyboard-types = "=0.8.0"
