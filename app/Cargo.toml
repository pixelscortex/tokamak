# The one desktop executable composes reusable hosts, never feature logic.
[package]
name = "tokamak-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "tokamak-desktop"
path = "src/main.rs"

[dependencies]
runtime = { path = "../packages/runtime", features = ["client"] }

[build-dependencies]
tokamak-build = { path = "../packages/build" }

# Native document tests drive the same Blitz controls as the desktop shell.
[dev-dependencies]
server = { path = "../packages/server" }
engine = { path = "../packages/engine" }
render = { path = "../packages/render" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tower = { version = "0.5.3", default-features = false }
blitz-dom = { git = "https://github.com/JustKira/blitz", rev = "378f3c6a459817f4ab083cb01968747c49ab576c", default-features = false, features = ["system-fonts"] }
blitz-traits = { git = "https://github.com/JustKira/blitz", rev = "378f3c6a459817f4ab083cb01968747c49ab576c" }
keyboard-types = "=0.8.0"
